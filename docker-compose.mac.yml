# Docker Compose override for macOS with native Ollama
# This configuration uses native Ollama for Metal GPU acceleration
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.mac.yml up -d
#
# Or set COMPOSE_FILE environment variable:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.mac.yml
#   docker-compose up -d

services:
  # Scale down the Docker-based Ollama service (we use native macOS Ollama instead)
  ollama:
    deploy:
      replicas: 0

  # Update API to use native Ollama on host
  api:
    environment:
      - DUCKDB_PATH=/app/data/warehouse.duckdb
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - AIRFLOW_API_URL=http://airflow-webserver:8080/api/v1
      - AIRFLOW_USERNAME=admin
      - AIRFLOW_PASSWORD=admin

